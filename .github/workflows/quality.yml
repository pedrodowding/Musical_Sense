name: Musical Sense quality checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  performance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check module syntax
        run: |
          for file in app.js music-data.js audio-engine.js performance-engine.js performance-view.js singing-data.js singing-engine.js lyrics-library.js singing-ui.js gamification.js backup.js instrument-data.js instrument-ui.js catalog.js discovery-ui.js sw.js; do
            node --input-type=module --check < "$file"
          done
      - name: Run instrument, vocal, lyrics and reward regression tests
        run: node --test tests/*.test.mjs
