<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171a35"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.webmanifest"><title>Musical Sense</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f5f5fc;background:#101327}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:650px;margin:auto;min-height:100dvh;padding:18px 16px 96px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:850;font-size:23px}.muted{color:#adb1c9}.pill{padding:8px 12px;border-radius:25px;background:#262b4b;font-size:13px}.hero{padding:24px 0 15px}h1{font-size:29px;margin:0 0 8px}h2{font-size:19px;margin:0 0 10px}.card{background:#1c2140;border:1px solid #333a61;border-radius:19px;padding:18px;margin:12px 0}.btn{border:0;border-radius:13px;padding:14px 18px;background:#a78bfa;color:#111329;font-weight:800}.btn.secondary{background:#303657;color:#fff}.btn:disabled{opacity:.5}.full{width:100%}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{padding:12px;border-radius:13px;background:#252b4c;text-align:center}.metric b{display:block;font-size:23px}.meter{height:12px;background:#0d1024;border-radius:20px;overflow:hidden}.meter>div{height:100%;width:0;background:#43dfae;transition:width .1s}.target{font-size:75px;font-weight:900;text-align:center;color:#b7a0ff;margin:16px 0}.status{min-height:65px;border-radius:13px;padding:13px;background:#282e50;line-height:1.4}.nav{position:fixed;bottom:0;left:0;right:0;background:#171b36;border-top:1px solid #3b4166;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}.nav button{flex:1;max-width:165px;padding:16px 4px;background:none;border:0;color:#b9bdd2}.nav button.active{color:#c3afff;font-weight:800}.choice{width:100%;padding:15px;text-align:left;background:#252b4b;border:1px solid #434b76;border-radius:12px;color:white;margin:5px 0}.choice.active{border-color:#a78bfa}.small{font-size:12px}.row{display:flex;gap:9px;align-items:center;justify-content:space-between}.input{width:100%;padding:13px;border:1px solid #49517b;border-radius:12px;background:#111630;color:white;margin:7px 0 13px}.good{color:#45e2b0}.warn{color:#ffcf79}.progress{height:8px;background:#303657;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:#a78bfa}.note{font-size:42px;font-weight:800}.hide{display:none}
</style></head><body><div class="app"><header class="top"><div class="logo">♫ Musical Sense</div><div class="pill" id="userBadge"></div></header><main id="view"></main></div><nav class="nav" id="nav"></nav>
<script>
const KEY='musical-sense-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{};if(!db||!Array.isArray(db.users))db={users:[{id:'u1',name:'Aluno 1',instrument:'Piano',xp:0,correct:0,attempts:0,lessons:[]}],active:'u1'};let page='home',lesson='notes',step=0,mic=null,ctx=null,analyser=null,stream=null,frame=0,lastHit=0,stable=0,lastPitch='',status='Microfone desligado',detected='—',hz=0,rms=0;const noteNames=['Dó','Ré','Mi','Fá','Sol','Lá','Si'],sequence=[60,62,64,65,67,69,71,72],melody=[60,64,67,64,62,65,64,60];const chords=[{name:'Dó maior',notes:[60,64,67]},{name:'Lá menor',notes:[69,72,76]},{name:'Fá maior',notes:[65,69,72]}];const $=s=>document.querySelector(s),user=()=>db.users.find(u=>u.id===db.active)||db.users[0],save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}};const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','&#39;':'&#39;'}[c]));const midiName=m=>['Dó','Dó♯','Ré','Ré♯','Mi','Fá','Fá♯','Sol','Sol♯','Lá','Lá♯','Si'][m%12]+' '+(Math.floor(m/12)-1);const target=()=>lesson==='chords'?chords[Math.floor(step/3)].notes[step%3]:lesson==='melody'?melody[step]:sequence[step];const total=()=>lesson==='chords'?9:8;function render(){const u=user();$('#userBadge').textContent=u.name+' · '+u.xp+' XP';$('#nav').innerHTML=[['home','⌂ Início'],['lessons','▤ Aulas'],['practice','♫ Praticar'],['profiles','♙ Perfis']].map(([k,n])=>'<button data-page="'+k+'" class="'+(page===k?'active':'')+'">'+n+'</button>').join('');let v='';if(page==='home')v='<section class="hero"><div class="muted">Seu próximo passo musical</div><h1>Aprenda ouvindo o que você toca.</h1><p class="muted">Use um instrumento físico. O iPad escuta e acompanha cada nota.</p></section><div class="grid"><div class="metric"><b>'+u.xp+'</b>XP</div><div class="metric"><b>'+(u.attempts?Math.round(100*u.correct/u.attempts):0)+'%</b>Precisão</div></div><div class="card"><h2>🎹 Primeiras notas</h2><p class="muted">Comece tocando Dó, Ré e Mi. Sem teclado virtual.</p><button class="btn full" data-start="notes">Começar aula</button></div><div class="card"><h2>🎙 Diagnóstico do som</h2><p class="muted">Veja se o microfone capta seu instrumento e qual nota identifica.</p><button class="btn secondary full" data-page="practice">Testar microfone</button></div>';if(page==='lessons')v='<section class="hero"><h1>Suas aulas</h1><p class="muted">Lições progressivas, com feedback do instrumento real.</p></section>'+[['notes','1. Notas musicais','Reconhecimento de notas individuais'],['melody','2. Primeira melodia','Toque uma sequência de oito notas'],['chords','3. Construindo acordes','Aprenda as notas de cada acorde, uma por vez']].map(([id,t,d])=>'<div class="card"><h2>'+t+(u.lessons.includes(id)?' ✓':'')+'</h2><p class="muted">'+d+'</p><button class="btn full" data-start="'+id+'">Iniciar</button></div>').join('');if(page==='profiles')v='<section class="hero"><h1>Perfis</h1><p class="muted">Cada aluno tem seu próprio progresso neste dispositivo.</p></section>'+db.users.map(u=>'<button class="choice '+(u.id===db.active?'active':'')+'" data-user="'+u.id+'"><strong>'+safe(u.name)+'</strong><br><span class="muted small">'+safe(u.instrument)+' · '+u.xp+' XP</span></button>').join('')+'<div class="card"><h2>Novo aluno</h2><input id="newName" class="input" maxlength="30" placeholder="Nome do aluno"><select id="newInstrument" class="input">'+['Piano','Teclado','Violão','Guitarra','Ukulele','Baixo'].map(n=>'<option>'+n+'</option>').join('')+'</select><button class="btn full" id="addUser">Criar perfil</button></div>';if(page==='practice'){const t=target();v='<section class="hero"><div class="row"><h2>'+(lesson==='notes'?'Notas musicais':lesson==='melody'?'Primeira melodia':'Construindo acordes')+'</h2><span class="pill">'+(step+1)+' / '+total()+'</span></div><div class="progress"><div style="width:'+(step/total()*100)+'%"></div></div></section><div class="card"><div class="muted" style="text-align:center">Toque no seu instrumento</div><div class="target">'+midiName(t)+'</div>'+(lesson==='chords'?'<p class="muted" style="text-align:center">Acorde '+chords[Math.floor(step/3)].name+': toque suas notas individualmente nesta etapa.</p>':'')+'<div class="status" id="audioStatus">'+safe(status)+'</div><div class="row" style="margin:14px 0"><span class="muted">Volume captado</span><span id="rmsText">0%</span></div><div class="meter"><div id="meterBar"></div></div><div class="grid" style="margin-top:13px"><div class="metric"><b id="detected">'+detected+'</b><span class="muted small">Nota detectada</span></div><div class="metric"><b id="frequency">'+(hz?Math.round(hz)+' Hz':'—')+'</b><span class="muted small">Frequência</span></div></div><button class="btn full" id="toggleMic" style="margin-top:15px">'+(mic?'Desligar microfone':'Ativar microfone')+'</button><p class="muted small">Se o volume subir mas nenhuma nota aparecer, toque uma nota isolada e sustentada. Para acordes simultâneos será necessário um detector polifônico específico.</p></div><button class="btn secondary full" data-page="lessons">Voltar às aulas</button>';}$('#view').innerHTML=v;}
function showStatus(s){status=s;let e=$('#audioStatus');if(e)e.textContent=s}
function stopMic(){if(frame)cancelAnimationFrame(frame);frame=0;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(ctx)ctx.close().catch(()=>{});ctx=null;analyser=null;mic=null;stable=0;lastPitch='';showStatus('Microfone desligado')}
async function startMic(){if(!navigator.mediaDevices?.getUserMedia){showStatus('Este navegador não disponibilizou acesso ao microfone. Abra o endereço HTTPS no Safari.');return}showStatus('Solicitando permissão do microfone...');try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();const src=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=2048;src.connect(analyser);mic=true;showStatus('Microfone ativo. Toque uma nota isolada e sustentada.');render();loop()}catch(e){stopMic();showStatus('Não foi possível ativar o microfone: '+e.message);render()}}
function pitch(buf,rate){let n=buf.length;let best=0,offset=0;let min=Math.floor(rate/1100),max=Math.min(Math.floor(rate/65),n/2);let energy=0;for(let i=0;i<n;i++)energy+=buf[i]*buf[i];if(energy/n<.00008)return 0;for(let lag=min;lag<max;lag++){let sum=0,a=0,b=0;for(let i=0;i<n-lag;i+=2){let x=buf[i],y=buf[i+lag];sum+=x*y;a+=x*x;b+=y*y}let corr=sum/Math.sqrt(a*b+1e-12);if(corr>best){best=corr;offset=lag}}return best>.82?rate/offset:0}
let lastAnalyze=0;function loop(time=0){if(!mic||!analyser)return;frame=requestAnimationFrame(loop);if(time-lastAnalyze<90)return;lastAnalyze=time;const b=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(b);let power=0;for(const x of b)power+=x*x;rms=Math.sqrt(power/b.length);const meter=$('#meterBar');if(meter)meter.style.width=Math.min(100,rms*650)+'%';if($('#rmsText'))$('#rmsText').textContent=Math.min(100,Math.round(rms*650))+'%';if(rms<.008){detected='—';hz=0;stable=0;showStatus('Microfone ativo. Aguardando som: aproxime o instrumento do iPad.')}else{hz=pitch(b,ctx.sampleRate);if(hz){const exactMidi=69+12*Math.log2(hz/440);const midi=Math.round(exactMidi);const cents=Math.round((exactMidi-midi)*100);detected=midiName(midi);showStatus('Som recebido: '+detected+' · afinação '+(cents>0?'+':'')+cents+' cents'+(midi===target()?' · mantenha a nota!':' · toque '+midiName(target())));if(midi===target()){if(lastPitch===midi)stable++;else stable=1;lastPitch=midi;if(stable>=3&&Date.now()-lastHit>650){lastHit=Date.now();stable=0;user().correct++;user().attempts++;user().xp+=15;step++;save();if(step>=total()){if(!user().lessons.includes(lesson))user().lessons.push(lesson);step=0;stopMic();page='lessons';render();alert('Aula concluída! Você ganhou XP.');return}render()}}else{stable=0;lastPitch=midi}}else{detected='—';showStatus('Som captado, mas sem nota estável. Toque apenas uma nota por vez.');stable=0}}if($('#detected'))$('#detected').textContent=detected;if($('#frequency'))$('#frequency').textContent=hz?Math.round(hz)+' Hz':'—'}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){if(page==='practice'&&b.dataset.page!=='practice')stopMic();page=b.dataset.page;render()}else if(b.dataset.start){stopMic();lesson=b.dataset.start;step=0;page='practice';status='Ative o microfone para iniciar a aula.';render()}else if(b.id==='toggleMic'){mic?stopMic():await startMic();render()}else if(b.dataset.user){stopMic();db.active=b.dataset.user;save();page='home';render()}else if(b.id==='addUser'){let n=$('#newName').value.trim();if(!n)return alert('Digite um nome.');db.users.push({id:'u'+Date.now(),name:n,instrument:$('#newInstrument').value,xp:0,correct:0,attempts:0,lessons:[]});db.active=db.users[db.users.length-1].id;save();page='home';render()}});render();
</script></body></html>
